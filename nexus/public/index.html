<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090F">
<meta name="description" content="NEXUS — локальная система команды ИИ-агентов: конструктор, сервисы, программы ПК и MCP-серверы.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXUS">
<meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <script>try{var __t=localStorage.getItem('nexus_theme');if(__t==='light'||__t==='dark'){document.documentElement.dataset.theme=__t;}else if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.dataset.theme='light';}}catch(__e){}</script>
  <title>NEXUS — команда ИИ-агентов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14L16 30 4 23V9Z' fill='%2307090F' stroke='%2338E8FF' stroke-width='2'/%3E%3Cpath d='M11 21V11l10 10V11' fill='none' stroke='%2338E8FF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>

  <div class="bg" aria-hidden="true">
    <div class="bg-aurora bg-aurora-a"></div>
    <div class="bg-aurora bg-aurora-b"></div>
    <div class="bg-aurora bg-aurora-c"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="NEXUS — на главную">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30">
            <path d="M16 2 28 9v14L16 30 4 23V9Z" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
            <path d="M11 21V11l10 10V11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-copy"><b>NEXUS</b><i>agent team os</i></span>
      </a>

      <nav class="nav" aria-label="Основная навигация">
        <a class="nav-item" data-nav="/" href="#/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Пульт</span>
        </a>
        <a class="nav-item" data-nav="/team" href="#/team">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Команда</span>
        </a>
        <a class="nav-item" data-nav="/kb" href="#/kb">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
          <span>Базы знаний</span>
        </a>
        <a class="nav-item" data-nav="/connect" href="#/connect">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
          <span>Подключения</span>
        </a>
      </nav>

      <div class="side-foot">
        <div class="sys">
          <span class="pulse-dot" id="sysDot" data-state="wait"></span>
          <span class="sys-copy"><b>Система</b><i id="sysText">подключение…</i></span>
        </div>
        <div class="build mono">v2.9.0 · local node</div>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Переключить тему оформления">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </aside>

    <nav class="tabbar" aria-label="Мобильная навигация">
      <a class="tabbar-item" data-nav="/" href="#/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Пульт</span>
      </a>
      <a class="tabbar-item" data-nav="/team" href="#/team">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Команда</span>
      </a>
      <a class="tabbar-item" data-nav="/kb" href="#/kb">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
        <span>Базы</span>
      </a>
      <a class="tabbar-item" data-nav="/connect" href="#/connect">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
        <span>Подключения</span>
      </a>
    </nav>

    <main class="view" id="view" tabindex="-1">
      <div class="boot" aria-label="Загрузка">
        <div class="boot-bar boot-w60 shimmer"></div>
        <div class="boot-bar boot-w30 shimmer"></div>
        <div class="boot-grid">
          <div class="boot-card shimmer"></div>
          <div class="boot-card shimmer"></div>
          <div class="boot-card shimmer"></div>
          <div class="boot-card shimmer"></div>
        </div>
      </div>
    </main>
  </div>

  <section class="dock" id="dock" data-state="closed" aria-label="Консоль выполнения">
    <header class="dock-head">
      <button class="dock-toggle" id="dockToggle" aria-expanded="false" aria-controls="dockBody" aria-label="Свернуть консоль">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="dock-title mono">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
        КОНСОЛЬ ВЫПОЛНЕНИЯ
      </span>
      <span class="dock-agent mono" id="dockAgent">ожидание команды</span>
      <span class="dock-timer mono" id="dockTimer">00:00</span>
      <span class="dock-badge mono" id="dockBadge" hidden></span>
      <div class="dock-actions">
        <button class="icon-btn" id="dockClear" aria-label="Очистить консоль">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="icon-btn" id="dockClose" aria-label="Закрыть консоль">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </header>
    <div class="dock-body" id="dockBody">
      <div class="dock-log" id="dockLog" role="log"></div>
    </div>
  </section>

  <button class="dock-fab" id="dockFab" aria-label="Открыть консоль выполнения">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
    <span class="mono">КОНСОЛЬ</span>
  </button>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-content" id="drawerContent"></div>
  </aside>

  <div class="modal-layer" id="modalLayer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
